; PHP settings Cacti 1.2.22's installer checks as requirements
; (lib/utility.php: memory_limit, max_execution_time, date.timezone). Set here
; explicitly so a run does not depend on the base image's defaults, which are
; below what Cacti asks for. 800M is Cacti 1.2.22's own documented requirement.
;
; NOTE: a browser "Allowed memory size exhausted in lib/database.php" fatal here
; is almost always NOT a memory shortfall — it is Cacti hitting an UNINSTALLED
; database (0 tables) and spiralling in its DB error/retry/backtrace path until
; PHP OOMs, at any limit. The fix is to run the install seed, not to raise this:
;   Targets/cacti/env/seed.sh     # idempotent; loads the schema + installer
memory_limit = 800M
max_execution_time = 60
date.timezone = UTC
