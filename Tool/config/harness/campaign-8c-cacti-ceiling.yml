# CAMPAIGN · BLOCK 8c · cacti ceiling re-run (completes block-8 to n=6).
#
#   uv run dast harness config/harness/campaign-8c-cacti-ceiling.yml --dry-run
#   uv run dast harness config/harness/campaign-8c-cacti-ceiling.yml
#
# WHY. Blocks 8 and 8b each landed only 1 of their cacti ceiling runs. The real
# cause (post-mortem, not the earlier readiness-gate theory): the heavy oracle+OOB
# verify runs nuclei past its 120s per-tool timeout, and `run_container` killed the
# `docker run` CLIENT on timeout — never the container, which keeps running under
# dockerd. That orphaned fuzzer kept hammering cacti; reset.sh restored a clean
# target but the straggler re-exhausted its apache workers + mariadb connections,
# so the next run's 30s auth timed out. FIXED at the source: run_container now names
# each container and force-removes it on timeout (mcp/_dispatch_common.py), and
# cacti's reset.sh sweeps any `dast-verify-*` straggler before restoring.
#
# This sheet runs the 3 MISSING cacti ceiling repeats to reach n=6 in the post
# corpus (block-6 1 + block-8 1 + block-8b 1 + these 3). Same config as block-8/8b's
# cacti row. Groups with them by (target, polarity) in the §10 spread; register this
# sheet as a post sheet beside campaign-8-even-fill and campaign-8b-cacti-ceiling.
# cacti's accumulation is off-surface (login log only), so the one non-reset block-6
# ceiling run stays valid alongside these --reset-target runs.
#
# PREREQUISITE: cacti snapshot already captured (575M). OOB stack (interactsh +
# dns-resolver) must be up. After: `dast cve` on each run.
#
# ~1.9h/run, serial, ~6h total.

defaults:
  base_env: config/scanner/.env
  max_cost_usd: 4.0
  timeout_minutes: 240
  env:
    TRIAGE_CODE_CONTEXT: handler+trace
    TRIAGE_HTTP_CONTEXT: balanced
    TRIAGE_PEER_CONTEXT: full
    TRIAGE_RETRIEVAL: push
    TRIAGE_SYNTHESIS_ENABLED: "on"
    TRIAGE_SYNTHESIS_REPEATS: "5"
    TRIAGE_PRUNE_NONINTERACTIVE_PHP: "off"
    TRIAGE_SCREENING_MODEL: deepseek/deepseek-v4-flash-0731
    TRIAGE_SCREENING_PROVIDER: wafer
    TRIAGE_SYNTHESIS_MODEL: deepseek/deepseek-v3.2
    TRIAGE_SYNTHESIS_PROVIDER: ""
    VERIFY_MODEL: minimax/minimax-m2.5
    VERIFY_PROVIDER: ""
    VERIFY_TOOL_CHOICE: table
    VERIFY_INVOCATION: llm
    VERIFY_MAX_ROUNDS: "3"
    VERIFY_MAX_DISPATCH_ALL_RULES: "15"
    VERIFY_MAX_DISPATCHES_TOTAL: "40"
    VERIFY_MAX_MINUTES: "30"
    VERIFY_TOOL_TIMEOUT_SECONDS: "120"
    VERIFY_MAX_SIBLINGS: "0"
    TRIAGE_PROMPT_VERSION: "3"
    TRIAGE_SYNTHESIS_PROMPT_VERSION: "5"
    VERIFY_PROMPT_VERSION: "2"
    SHARED_ORACLE: "off"
    SHARED_RUN_MAX_COST_USD: "2.0"

rows:
  - name: cacti-admin-ceiling
    target: cacti
    stages: [scan, triage, verify]
    repeat: 3
    env:
      SHARED_AUTH_MODE: admin
      SHARED_ORACLE: "on"
      SCAN_RESET_TARGET: "on"
      VERIFY_OOB: "on"
      VERIFY_INTERACTSH_SERVER: http://interactsh.local:8080
      VERIFY_INTERACTSH_DNS: "172.19.0.252"
