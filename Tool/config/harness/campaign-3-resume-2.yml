# CAMPAIGN · BLOCK 3 · RESUME-2 (2026-10-13).
#
# The block-3 resume (campaign-3-resume.yml) completed 7 of 11; the last 4 rows —
# cacti-user-crawl x2, gitea-user-crawl x2 — failed with Docker "no space left on
# device" when the Docker VM disk filled (dast-zap had accumulated 46.6 GB of ZAP
# session stores + /tmp). Reclaimed by pruning the build cache and recreating the
# ephemeral dast-zap container (VM now 46% used, 64 GB free; no data touched).
# This runs the 4 remaining G4 crawler-only (Noir off, scan-only, free) scans.
# Same scan config as the grafana/wordpress crawls that already ran, so the
# analyzer groups them.
#   uv run dast harness config/harness/campaign-3-resume-2.yml

defaults:
  base_env: config/scanner/.env
  max_cost_usd: 1.0        # scan-only — spends nothing; headroom only.
  timeout_minutes: 240
  env:
    # campaign commit: bc30e8d7b4fce15618b9081a76213d4ebfaae8ac   # P7 — same commit as blocks 1-3
    TRIAGE_SCREENING_MODEL: deepseek/deepseek-v4-flash-0731
    TRIAGE_SCREENING_PROVIDER: wafer
    TRIAGE_SYNTHESIS_MODEL: deepseek/deepseek-v3.2
    TRIAGE_SYNTHESIS_PROVIDER: ""
    VERIFY_MODEL: minimax/minimax-m2.5
    VERIFY_PROVIDER: friendli
    SHARED_ORACLE: "off"
    SHARED_AUTH_MODE: user
    SHARED_RUN_MAX_COST_USD: "2.0"

rows:
  - {name: cacti-user-crawl,     target: cacti,     stages: [scan], repeat: 2, env: {SCAN_NOIR_ENABLED: "off"}}
  - {name: gitea-user-crawl,     target: gitea,     stages: [scan], repeat: 2, env: {SCAN_NOIR_ENABLED: "off"}}
