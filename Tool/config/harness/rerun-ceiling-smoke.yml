# RESCAN · ceiling validation — one --oracle ceiling per target, end to end.
# NOT a corpus sheet: a pre-rescan functional check on the frozen stack (freeze
# tag rerun-2026-11-03f). One run per target, at the level that should reach each
# marker, cacti LAST (its OOB RCE deadlock only bites a SUBSEQUENT cacti run, so a
# single ceiling completes without the driver).
#
#   uv run dast harness config/harness/rerun-ceiling-smoke.yml
#
# Validates: reset-before-scan restores each clean snapshot; scan→triage→verify
# run on the frozen config; the unauth markers confirm (grafana ffuf, cacti
# CVE-2022-46169 OOB); WordPress runs at ADMIN so its only confirmable marker
# (CVE-2021-25069 stats SQLi, auth: admin) is actually seeded and reached — the
# first honest test of it, since every prior WP run scanned logged out; and —
# the open question — that one cacti ceiling completes under the frozen
# 150 s / 30 verify config without exhausting MariaDB connections mid-run.

defaults:
  base_env: config/scanner/.env
  max_cost_usd: 12.0
  timeout_minutes: 240
  env:
    SCAN_RESET_TARGET: "on"
    TRIAGE_CODE_CONTEXT: handler+trace
    TRIAGE_HTTP_CONTEXT: balanced
    TRIAGE_PEER_CONTEXT: full
    TRIAGE_RETRIEVAL: push
    TRIAGE_SYNTHESIS_ENABLED: "on"
    TRIAGE_SYNTHESIS_REPEATS: "5"
    TRIAGE_PRUNE_NONINTERACTIVE_PHP: "off"
    TRIAGE_SCREENING_MODEL: deepseek/deepseek-v4-flash-0731
    TRIAGE_SCREENING_PROVIDER: wafer
    TRIAGE_SYNTHESIS_MODEL: deepseek/deepseek-v3.2
    TRIAGE_SYNTHESIS_PROVIDER: ""
    VERIFY_MODEL: minimax/minimax-m2.5
    VERIFY_PROVIDER: ""
    VERIFY_INVOCATION: llm
    VERIFY_MAX_ROUNDS: "3"
    VERIFY_MAX_DISPATCH_ALL_RULES: "30"
    VERIFY_MAX_DISPATCHES_TOTAL: "40"
    VERIFY_MAX_MINUTES: "20"
    VERIFY_TOOL_TIMEOUT_SECONDS: "150"
    VERIFY_MAX_SIBLINGS: "0"
    VERIFY_OOB: "off"
    TRIAGE_PROMPT_VERSION: "3"
    TRIAGE_SYNTHESIS_PROMPT_VERSION: "5"
    VERIFY_PROMPT_VERSION: "2"
    SHARED_ORACLE: "on"
    SHARED_RUN_MAX_COST_USD: "2.0"

rows:
  # grafana: TRIAGE_CODE_CONTEXT none — Noir extracts none of Grafana's routes
  # (custom RouteRegister), so no handler can be located and the triage gate
  # would refuse the row. Stated, not degraded. → DECISIONS.md.
  - {name: grafana-none-ceiling,  target: grafana,  stages: [scan, triage, verify], env: {SHARED_AUTH_MODE: none, TRIAGE_CODE_CONTEXT: none}}
  # wordpress at ADMIN: CVE-2021-25069 (stats SQLi) is auth: admin, so the gate
  # must seed a real admin session to exercise WP's only confirmable marker.
  - {name: wordpress-admin-ceiling, target: wordpress, stages: [scan, triage, verify], env: {SHARED_AUTH_MODE: admin}}
  - {name: gitea-user-ceiling,    target: gitea,    stages: [scan, triage, verify], env: {SHARED_AUTH_MODE: user}}
  - name: cacti-admin-ceiling
    target: cacti
    stages: [scan, triage, verify]
    env:
      SHARED_AUTH_MODE: admin
      VERIFY_OOB: "on"
      VERIFY_INTERACTSH_SERVER: http://interactsh.local:8080
      VERIFY_INTERACTSH_DNS: "172.19.0.252"
