# CAMPAIGN · BLOCK 2 · G2 — the --oracle ceiling matrix.
# Thesis-Analyzer/RUN-PLAN.md §5 (G2), §6 (block 2). NEVER a detection number.
#
#   uv run dast harness config/harness/campaign-2-ceiling-matrix.yml --dry-run
#   uv run dast harness config/harness/campaign-2-ceiling-matrix.yml
#
# WHAT THIS IS. The upper bound per session level: 4 targets x {none, user,
# admin} = 12 cells, each a fresh `scan triage verify` with the oracle ON
# (`SHARED_ORACLE: on` seeds the documented sinks and hands every LLM stage the
# target's oracle.md). Every artifact carries `oracle_guided: true`. These are
# the "detectable but missed" ceiling — they never share a table with a blind
# row, and the ladder (blind vs ceiling) is derived by `dast cve` / the analyzer,
# not stored (RUN-PLAN §8-§9). No `report` stage: a ceiling is not a deliverable.
#
# ORDER IS EXECUTION ORDER and FIXED: grafana, wordpress, cacti, gitea; within a
# target none, user, admin (RUN-PLAN §6). Run AFTER block 1.
#
# THREE CELLS SERVE NO MARKER (RUN-PLAN §5): gitea-admin, grafana-admin,
# cacti-user exist only for the across-level comparison. Dropping them saves
# three scans — the author's call; they are kept here for the full matrix.
#
# PREREQUISITES: as block 1 (P1 user accounts for grafana-user / cacti-user, P3
# provider slugs, P7 commit). PLUS P9 for the Cacti ceiling rows: bring up the
# OOB stack (`docker compose -f docker/oob.yml up -d`) so nuclei's interactsh
# callback can confirm Cacti's CVE-2022-46169 out of band. The VERIFY_INTERACTSH_*
# values below mirror the pilot's; CONFIRM VERIFY_INTERACTSH_DNS matches the live
# resolver's address on dast-net (it is environment-specific).
#
# AFTER IT LANDS: pair each ceiling run with its block-1 blind run —
# `dast cve <blind-id> <ceiling-id>` — to write both cve-detection.json and print
# the ladder (two-run form: one blind, one --oracle, no live counterpart spawned).

defaults:
  base_env: config/scanner/.env
  max_cost_usd: 8.0        # RUN-PLAN §7 expects ~2.52 USD for G2; ~3x headroom.
  timeout_minutes: 240
  env:
    # campaign commit: bc30e8d7b4fce15618b9081a76213d4ebfaae8ac   # P7 — same commit as block 1
    TRIAGE_CODE_CONTEXT: handler+trace
    TRIAGE_HTTP_CONTEXT: balanced
    TRIAGE_PEER_CONTEXT: full
    TRIAGE_RETRIEVAL: push
    TRIAGE_SYNTHESIS_ENABLED: "on"
    TRIAGE_SYNTHESIS_REPEATS: "5"
    TRIAGE_PRUNE_NONINTERACTIVE_PHP: "off"
    TRIAGE_SCREENING_MODEL: deepseek/deepseek-v4-flash-0731
    TRIAGE_SCREENING_PROVIDER: wafer
    TRIAGE_SYNTHESIS_MODEL: deepseek/deepseek-v3.2
    TRIAGE_SYNTHESIS_PROVIDER: ""   # preference-routed, not pinned: baidu failed ~80% of deepseek-v3.2 calls 2026-10-12; served provider recorded per call
    VERIFY_MODEL: minimax/minimax-m2.5
    VERIFY_PROVIDER: friendli
    VERIFY_TOOL_CHOICE: table
    VERIFY_INVOCATION: llm
    VERIFY_MAX_ROUNDS: "3"
    VERIFY_MAX_DISPATCH_ALL_RULES: "15"
    VERIFY_MAX_DISPATCHES_TOTAL: "40"
    VERIFY_MAX_MINUTES: "30"
    VERIFY_TOOL_TIMEOUT_SECONDS: "120"
    VERIFY_MAX_SIBLINGS: "0"
    VERIFY_OOB: "off"          # overridden ON for the Cacti ceiling rows below
    TRIAGE_PROMPT_VERSION: "3"
    TRIAGE_SYNTHESIS_PROMPT_VERSION: "5"
    VERIFY_PROMPT_VERSION: "2"
    # The ceiling polarity for the whole sheet. Per-row rows inherit it.
    SHARED_ORACLE: "on"
    SHARED_RUN_MAX_COST_USD: "2.0"

rows:
  # == grafana ===============================================================
  - {name: grafana-none-ceiling,  target: grafana, stages: [scan, triage, verify], env: {SHARED_AUTH_MODE: none}}
  - {name: grafana-user-ceiling,  target: grafana, stages: [scan, triage, verify], env: {SHARED_AUTH_MODE: user}}   # P1 done (user seeded)
  - {name: grafana-admin-ceiling, target: grafana, stages: [scan, triage, verify], env: {SHARED_AUTH_MODE: admin}}  # serves no marker (cross-level only)

  # == wordpress =============================================================
  - {name: wordpress-none-ceiling,  target: wordpress, stages: [scan, triage, verify], env: {SHARED_AUTH_MODE: none}}
  - {name: wordpress-user-ceiling,  target: wordpress, stages: [scan, triage, verify], env: {SHARED_AUTH_MODE: user}}
  - {name: wordpress-admin-ceiling, target: wordpress, stages: [scan, triage, verify], env: {SHARED_AUTH_MODE: admin}}

  # == cacti (ceiling rows run the OOB confirmation — P9) ====================
  # Cacti's flagship CVE-2022-46169 (unauth RCE) is confirmed out of band: the
  # oracle-seeded scan puts remote_agent.php in the tree and VERIFY_OOB lets
  # nuclei confirm it via interactsh. Needs docker/oob.yml up.
  - name: cacti-none-ceiling
    target: cacti
    stages: [scan, triage, verify]
    env:
      SHARED_AUTH_MODE: none
      VERIFY_OOB: "on"
      VERIFY_INTERACTSH_SERVER: http://interactsh.local:8080
      VERIFY_INTERACTSH_DNS: "172.19.0.252"
  - name: cacti-user-ceiling        # serves no marker (cross-level only)
    target: cacti
    stages: [scan, triage, verify]
    env:
      SHARED_AUTH_MODE: user        # P1 done (user seeded)
      VERIFY_OOB: "on"
      VERIFY_INTERACTSH_SERVER: http://interactsh.local:8080
      VERIFY_INTERACTSH_DNS: "172.19.0.252"
  - name: cacti-admin-ceiling
    target: cacti
    stages: [scan, triage, verify]
    env:
      SHARED_AUTH_MODE: admin
      VERIFY_OOB: "on"
      VERIFY_INTERACTSH_SERVER: http://interactsh.local:8080
      VERIFY_INTERACTSH_DNS: "172.19.0.252"

  # == gitea =================================================================
  - {name: gitea-none-ceiling,  target: gitea, stages: [scan, triage, verify], env: {SHARED_AUTH_MODE: none}}
  - {name: gitea-user-ceiling,  target: gitea, stages: [scan, triage, verify], env: {SHARED_AUTH_MODE: user}}
  - {name: gitea-admin-ceiling, target: gitea, stages: [scan, triage, verify], env: {SHARED_AUTH_MODE: admin}}  # serves no marker (cross-level only)
