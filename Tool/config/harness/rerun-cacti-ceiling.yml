# RESCAN · Cacti --oracle ceiling, ONE run per invocation.
# Frozen rescan of 2026-11-03 (NEXT_SESSION §6, as block 8d).
#
# Run ONLY through the driver, never inline with other rows:
#   ./config/harness/rerun-cacti-ceiling-driver.sh [N]
#
# WHY ONE PER INVOCATION. The ceiling verify's nuclei CVE-2022-46169 OOB template
# genuinely RCEs Cacti: the injected command spawns resident `script_server.php
# realtime` processes that each hold a MariaDB connection and never exit, so the
# fuzzing saturates max_connections and Cacti deadlocks AFTER the scan. A run
# survives its own verify, but the next run's reset races a wedged target and its
# login times out. The driver does a full `docker restart` + a login-readiness
# probe before each invocation to recover Cacti to a loginable state first. The
# leak is mitigated, not fixed (the one-per-invocation driver IS the mitigation).
#
# This is the authenticated (admin) ceiling — the cell that confirms
# CVE-2022-46169 out of band (cd167d6 / c7cec82 / the interactsh passthrough).
# For the cross-level none/user ceiling cells, copy this sheet with
# SHARED_AUTH_MODE: none / user and drive each the same one-per-invocation way.

defaults:
  base_env: config/scanner/.env
  max_cost_usd: 4.0
  timeout_minutes: 240
  env:
    # freeze commit: rerun-2026-11-03f
    SCAN_RESET_TARGET: "on"
    TRIAGE_CODE_CONTEXT: handler+trace
    TRIAGE_HTTP_CONTEXT: balanced
    TRIAGE_PEER_CONTEXT: full
    TRIAGE_RETRIEVAL: push
    TRIAGE_SYNTHESIS_ENABLED: "on"
    TRIAGE_SYNTHESIS_REPEATS: "5"
    TRIAGE_PRUNE_NONINTERACTIVE_PHP: "off"
    TRIAGE_SCREENING_MODEL: deepseek/deepseek-v4-flash-0731
    TRIAGE_SCREENING_PROVIDER: wafer
    TRIAGE_SYNTHESIS_MODEL: deepseek/deepseek-v3.2
    TRIAGE_SYNTHESIS_PROVIDER: ""
    VERIFY_MODEL: minimax/minimax-m2.5
    VERIFY_PROVIDER: ""
    VERIFY_INVOCATION: llm
    VERIFY_MAX_ROUNDS: "3"
    VERIFY_MAX_DISPATCH_ALL_RULES: "30"
    VERIFY_MAX_DISPATCHES_TOTAL: "40"
    VERIFY_MAX_MINUTES: "20"
    VERIFY_TOOL_TIMEOUT_SECONDS: "150"
    VERIFY_MAX_SIBLINGS: "0"
    TRIAGE_PROMPT_VERSION: "3"
    TRIAGE_SYNTHESIS_PROMPT_VERSION: "5"
    VERIFY_PROMPT_VERSION: "2"
    SHARED_RUN_MAX_COST_USD: "2.0"

rows:
  - name: cacti-admin-ceiling
    target: cacti
    stages: [scan, triage, verify]
    env:
      SHARED_AUTH_MODE: admin
      SHARED_ORACLE: "on"
      VERIFY_OOB: "on"
      VERIFY_INTERACTSH_SERVER: http://interactsh.local:8080
      VERIFY_INTERACTSH_DNS: "172.19.0.252"
