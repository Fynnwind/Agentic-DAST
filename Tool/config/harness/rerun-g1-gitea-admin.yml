# RESCAN · G1's Gitea admin cell, again at rerun-2026-11-03e. It replaces row
# gitea-admin-blind of the G1 sheet that ran at rerun-2026-11-03c (sheet 20261104T011344Z),
# which failed in verify. Its scan created 13,197 site-wide webhooks under /admin/hooks,
# /admin/default-hooks and /admin/system-hooks. Every push fanned out to all of them,
# Gitea's SQLite stalled from 12:17 UTC, and verify's login timed out. -03e blocks those
# routes (Gitea's destructive_markers, POST-FREEZE-CHANGES.md 1.18), and dast-net has no
# internet access (Targets/net-no-egress.sh). The row is unchanged
# (tests/unit/test_rerun_sheets.py pins it).
#
#   uv run dast harness config/harness/rerun-g1-gitea-admin.yml
#
# After it, scripts/rerun-rewire-refs.py takes Gitea's admin-blind run from THIS sheet:
# <G1 dir> <rerun-g1-cacti-signed-in dir> <this sheet's dir>.
defaults:
  base_env: config/scanner/.env
  max_cost_usd: 8.0
  timeout_minutes: 240
  env:
    # freeze commit: rerun-2026-11-03f
    SCAN_RESET_TARGET: "on"
    TRIAGE_CODE_CONTEXT: handler+trace
    TRIAGE_HTTP_CONTEXT: balanced
    TRIAGE_PEER_CONTEXT: full
    TRIAGE_RETRIEVAL: push
    TRIAGE_SYNTHESIS_ENABLED: "on"
    TRIAGE_SYNTHESIS_REPEATS: "5"
    TRIAGE_PRUNE_NONINTERACTIVE_PHP: "off"
    TRIAGE_SCREENING_MODEL: deepseek/deepseek-v4-flash-0731
    TRIAGE_SCREENING_PROVIDER: wafer
    TRIAGE_SYNTHESIS_MODEL: deepseek/deepseek-v3.2
    TRIAGE_SYNTHESIS_PROVIDER: ""
    VERIFY_MODEL: minimax/minimax-m2.5
    VERIFY_PROVIDER: ""
    VERIFY_INVOCATION: llm
    VERIFY_MAX_ROUNDS: "3"
    VERIFY_MAX_DISPATCH_ALL_RULES: "30"
    VERIFY_MAX_DISPATCHES_TOTAL: "40"
    VERIFY_MAX_MINUTES: "20"
    VERIFY_TOOL_TIMEOUT_SECONDS: "150"
    VERIFY_MAX_SIBLINGS: "0"
    VERIFY_OOB: "off"
    TRIAGE_PROMPT_VERSION: "3"
    TRIAGE_SYNTHESIS_PROMPT_VERSION: "5"
    VERIFY_PROMPT_VERSION: "2"
    SHARED_ORACLE: "off"
    SHARED_RUN_MAX_COST_USD: "2.0"

rows:
  - {name: gitea-admin-blind, target: gitea, stages: [scan, triage, verify, report], env: {SHARED_AUTH_MODE: admin}}
