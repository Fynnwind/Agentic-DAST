# CAMPAIGN · BLOCK 4 · PHASE B — the DEFERRED verify work (2026-10-13). Generated.
# Runs AFTER block 3 (verify -> probes targets; §6) and ALONE (tree-wide cost
# ceiling). Completes block 4. G5 verify threads `correlation:` to each Phase-A
# triage rep (out-suffix = row name, so verification-<suffix> sits beside
# triage-<suffix>). G6 = verification configs on the BASE block-1 triage
# (correlation "" -> base). Report omitted for G5 reps (rendering, not a spread input).
#   uv run dast harness config/harness/campaign-4b-verify-deferred.yml

defaults:
  base_env: config/scanner/.env
  max_cost_usd: 8.0
  timeout_minutes: 150
  env:
    # campaign commit: bc30e8d7b4fce15618b9081a76213d4ebfaae8ac   # P7 — same commit as blocks 1-3
    TRIAGE_SCREENING_MODEL: deepseek/deepseek-v4-flash-0731
    TRIAGE_SCREENING_PROVIDER: wafer
    TRIAGE_SYNTHESIS_MODEL: deepseek/deepseek-v3.2
    TRIAGE_SYNTHESIS_PROVIDER: ""
    VERIFY_MODEL: minimax/minimax-m2.5
    VERIFY_PROVIDER: friendli
    VERIFY_TOOL_CHOICE: table
    VERIFY_INVOCATION: llm
    VERIFY_MAX_ROUNDS: "3"
    VERIFY_MAX_DISPATCH_ALL_RULES: "15"
    VERIFY_MAX_DISPATCHES_TOTAL: "40"
    VERIFY_MAX_MINUTES: "30"
    VERIFY_TOOL_TIMEOUT_SECONDS: "120"
    VERIFY_MAX_SIBLINGS: "0"
    VERIFY_OOB: "off"
    VERIFY_PROMPT_VERSION: "2"
    SHARED_ORACLE: "off"
    SHARED_AUTH_MODE: user
    SHARED_RUN_MAX_COST_USD: "2.0"

