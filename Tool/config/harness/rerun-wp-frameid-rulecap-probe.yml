# PROBE · Is WordPress frameid (CVE-2022-1985) lost to ZAP's 5-min per-rule cap?
# A labeled probe, NOT a corpus cell: it changes the scan caps, so it never joins
# the G2 ceiling or any band.
#
#   ./Targets/net-no-egress.sh            # from Implementation/, as before every sheet
#   uv run dast harness config/harness/rerun-wp-frameid-rulecap-probe.yml
#
# WHAT IS KNOWN. In the frozen G2 none ceiling (20261104T205309Z-wordpress-1dbeb4,
# 288 URLs) ZAP finished 48 of 48 rules inside the 45-min cap, and the ONLY rule
# cut by the 5-min per-rule cap was DomXssScanRule (40026): "skipped plugin
# [exceeded max rule time] … in 303.906s with 869 message(s) sent and 0 alert(s)"
# (data/zap-logs/zap-rule-outcomes-2026-11-04_07.tsv). 40026 is the rule that
# found frameid every time it was found (3 runs, all on trees where the client
# spider stalled early: 272, 272 and 417 URLs); on the 12 ~287-URL ceilings where
# the client spider ran to its time cap it found nothing at all.
#
# WHAT THIS TESTS. The same scan as that G2 cell (same defaults, oracle seeds,
# auth none, reset), scan stage only, with the per-rule cap raised 5 → 30 min.
# Nothing else in the none scan was rule-capped, so in practice only 40026 gets
# more time. The active-scan cap is raised 45 → 90 min so the longer 40026 cannot
# push the scan into the total cap (11 min of rules ran before 40026 and 16 after).
# Scan only: no triage or verify, so no model calls (~$0); about 60–75 min.
#
# READOUT (right after the run, before dast-zap is recreated or its log rotates):
#   docker exec dast-zap grep 'target-wordpress | DomXssScanRule' /home/zap/.ZAP/zap.log | tail -2
#   + the run's scan-zap-alerts.json: alerts with pluginId 40026 and param frameid.
#   - completed in > 300 s AND a 40026 alert on frameid → the 5-min cap is what cut
#     it; the log's seconds say how much DOM-XSS time this tree needs.
#   - completed with no frameid alert → not the cap: given time, 40026 still misses
#     frameid on this tree.
#   - skipped [exceeded max rule time] at ~1800 s → it needs > 30 min: cap-bound,
#     but out of reach of any practical cap.
#   - completed in < 300 s → this draw's client spider stalled (smaller tree), so
#     the 5-min cap would not have bound either; uninformative, run it again.
# Append the DomXssScanRule lines to data/zap-logs/ beside the frozen extract.
#
# Defaults are the G2 ceiling sheet's, unchanged (pinned by
# tests/unit/test_rerun_sheets.py); the row adds only the two caps and drops
# triage and verify.

defaults:
  base_env: config/scanner/.env
  max_cost_usd: 8.0
  timeout_minutes: 240
  env:
    # freeze commit: rerun-2026-11-03f
    SCAN_RESET_TARGET: "on"
    TRIAGE_CODE_CONTEXT: handler+trace
    TRIAGE_HTTP_CONTEXT: balanced
    TRIAGE_PEER_CONTEXT: full
    TRIAGE_RETRIEVAL: push
    TRIAGE_SYNTHESIS_ENABLED: "on"
    TRIAGE_SYNTHESIS_REPEATS: "5"
    TRIAGE_PRUNE_NONINTERACTIVE_PHP: "off"
    TRIAGE_SCREENING_MODEL: deepseek/deepseek-v4-flash-0731
    TRIAGE_SCREENING_PROVIDER: wafer
    TRIAGE_SYNTHESIS_MODEL: deepseek/deepseek-v3.2
    TRIAGE_SYNTHESIS_PROVIDER: ""
    VERIFY_MODEL: minimax/minimax-m2.5
    VERIFY_PROVIDER: ""
    VERIFY_INVOCATION: llm
    VERIFY_MAX_ROUNDS: "3"
    VERIFY_MAX_DISPATCH_ALL_RULES: "30"
    VERIFY_MAX_DISPATCHES_TOTAL: "40"
    VERIFY_MAX_MINUTES: "20"
    VERIFY_TOOL_TIMEOUT_SECONDS: "150"
    VERIFY_MAX_SIBLINGS: "0"
    VERIFY_OOB: "off"
    TRIAGE_PROMPT_VERSION: "3"
    TRIAGE_SYNTHESIS_PROMPT_VERSION: "5"
    VERIFY_PROMPT_VERSION: "2"
    SHARED_ORACLE: "on"
    SHARED_RUN_MAX_COST_USD: "2.0"

rows:
  - name: wordpress-none-ceiling-rulecap30
    target: wordpress
    stages: [scan]
    env:
      SHARED_AUTH_MODE: none
      SCAN_ZAP_MAX_RULE_MINUTES: "30"
      SCAN_ZAP_MAX_ACTIVE_SCAN_MINUTES: "90"
