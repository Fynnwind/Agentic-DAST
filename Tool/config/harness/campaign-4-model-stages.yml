# CAMPAIGN · BLOCK 4 · G5 (model repeats) + G6 (verify configs) + G7 (context).
# Thesis-Analyzer/RUN-PLAN.md §5 (G5-G7), §6 (block 4). No scans — model stages
# only, acting on the reference SCANS that blocks 1-2 minted.
#
#   uv run dast harness config/harness/campaign-4-model-stages.yml --dry-run
#   uv run dast harness config/harness/campaign-4-model-stages.yml
#
# ===========================================================================
# TEMPLATE — FILL THE RUN IDS FIRST. Every row acts on a stored reference scan
# via `run:`, and those ids only exist after blocks 1-2. Replace each placeholder
# with the real minted id (from `dast run-index` or the block sheets' comparison.md):
#   REF-<t>-user-blind     -> block 1's  <t>-user-blind   SCAN run id   (4 ids)
#   REF-<t>-user-ceiling   -> block 2's  <t>-user-ceiling SCAN run id   (4 ids)
# Until filled, `--dry-run` reports every row as "no stored run holds ..." — that
# is the not-ready signal, not an error. Run AFTER block 4's scans exist and NOT
# beside any scan (these rows verify; §6).
# ===========================================================================
#
# G5 — MODEL REPEATS (RUN-PLAN §5 G5). Re-run the model stages on ONE stored
# scan to measure their spread. On the G1 blind reference scan: `rep`, T V R,
# repeat 4 -> rep-1..rep-4 (5 samples with block 1's base triage). On the G2
# ceiling reference scan: `rep`, T V, repeat 2 (3 with block 2's). The analyzer
# groups each set by config digest; the spread is §8.3's "smaller than the
# spread" yardstick.
#
# G6 — VERIFICATION CONFIGURATIONS (RUN-PLAN §5 G6). All read the SAME stored
# triage — block 1's base `triage.json` — so only verification varies. These are
# verify-only rows with NO `correlation:` set, which makes the input the base
# triage (the harness passes `--in-suffix ""`); the output is suffixed by the row
# name. vdet = fixed tool + deterministic call (no model, no key, free); vdef =
# table tool + model call (the block-1 default, 2 more here = 3); vllm = model
# tool + model call.
#
# G7 — CONTEXT (RUN-PLAN §5 G7). Triage-only on the G1 blind reference scan:
# codenone (no handler source) and peernone (no peer context), 3 each, read
# against the 5 default triages of G1+G5.

defaults:
  base_env: config/scanner/.env
  max_cost_usd: 15.0       # RUN-PLAN §7: G5 ~4.66 + G6 ~1.11 + G7 ~3.14 ≈ 8.9.
  timeout_minutes: 150     # per execution; no scans, Cacti triage is the worst.
  env:
    # campaign commit: bc30e8d7b4fce15618b9081a76213d4ebfaae8ac   # P7 — same commit as blocks 1-3
    TRIAGE_CODE_CONTEXT: handler+trace
    TRIAGE_HTTP_CONTEXT: balanced
    TRIAGE_PEER_CONTEXT: full
    TRIAGE_RETRIEVAL: push
    TRIAGE_SYNTHESIS_ENABLED: "on"
    TRIAGE_SYNTHESIS_REPEATS: "5"
    TRIAGE_PRUNE_NONINTERACTIVE_PHP: "off"
    TRIAGE_SCREENING_MODEL: deepseek/deepseek-v4-flash-0731
    TRIAGE_SCREENING_PROVIDER: wafer
    TRIAGE_SYNTHESIS_MODEL: deepseek/deepseek-v3.2
    TRIAGE_SYNTHESIS_PROVIDER: ""   # preference-routed, not pinned: baidu failed ~80% of deepseek-v3.2 calls 2026-10-12; served provider recorded per call
    VERIFY_MODEL: minimax/minimax-m2.5
    VERIFY_PROVIDER: friendli
    VERIFY_TOOL_CHOICE: table
    VERIFY_INVOCATION: llm
    VERIFY_MAX_ROUNDS: "3"
    VERIFY_MAX_DISPATCH_ALL_RULES: "15"
    VERIFY_MAX_DISPATCHES_TOTAL: "40"
    VERIFY_MAX_MINUTES: "30"
    VERIFY_TOOL_TIMEOUT_SECONDS: "120"
    VERIFY_MAX_SIBLINGS: "0"
    VERIFY_OOB: "off"
    TRIAGE_PROMPT_VERSION: "3"
    TRIAGE_SYNTHESIS_PROMPT_VERSION: "5"
    VERIFY_PROMPT_VERSION: "2"
    SHARED_ORACLE: "off"
    SHARED_AUTH_MODE: user
    SHARED_RUN_MAX_COST_USD: "2.0"

rows:
  # == G5 · model repeats on the G1 blind reference scan (rep, T V R x4) =====
  - {name: grafana-user-blind-rep,   run: REF-grafana-user-blind,   stages: [triage, verify, report], repeat: 4}
  - {name: wordpress-user-blind-rep, run: REF-wordpress-user-blind, stages: [triage, verify, report], repeat: 4}
  - {name: cacti-user-blind-rep,     run: REF-cacti-user-blind,     stages: [triage, verify, report], repeat: 4}
  - {name: gitea-user-blind-rep,     run: REF-gitea-user-blind,     stages: [triage, verify, report], repeat: 4}

  # == G5 · model repeats on the G2 ceiling reference scan (rep, T V x2) =====
  # Oracle ON — these re-triage the oracle-seeded ceiling scan.
  - {name: grafana-user-ceiling-rep,   run: REF-grafana-user-ceiling,   stages: [triage, verify], repeat: 2, env: {SHARED_ORACLE: "on"}}
  - {name: wordpress-user-ceiling-rep, run: REF-wordpress-user-ceiling, stages: [triage, verify], repeat: 2, env: {SHARED_ORACLE: "on"}}
  - {name: cacti-user-ceiling-rep,     run: REF-cacti-user-ceiling,     stages: [triage, verify], repeat: 2, env: {SHARED_ORACLE: "on"}}
  - {name: gitea-user-ceiling-rep,     run: REF-gitea-user-ceiling,     stages: [triage, verify], repeat: 2, env: {SHARED_ORACLE: "on"}}

  # == G6 · verification configurations on the G1 blind reference triage =====
  # verify-only; no `correlation:` -> reads the base triage.json (the G1 triage).
  # vdet (fixed tool + deterministic call): no model, no key, free.
  - {name: grafana-user-blind-vdet,   run: REF-grafana-user-blind,   stages: [verify], repeat: 2, env: {VERIFY_TOOL_CHOICE: table, VERIFY_INVOCATION: deterministic}}
  - {name: wordpress-user-blind-vdet, run: REF-wordpress-user-blind, stages: [verify], repeat: 2, env: {VERIFY_TOOL_CHOICE: table, VERIFY_INVOCATION: deterministic}}
  - {name: cacti-user-blind-vdet,     run: REF-cacti-user-blind,     stages: [verify], repeat: 2, env: {VERIFY_TOOL_CHOICE: table, VERIFY_INVOCATION: deterministic}}
  - {name: gitea-user-blind-vdet,     run: REF-gitea-user-blind,     stages: [verify], repeat: 2, env: {VERIFY_TOOL_CHOICE: table, VERIFY_INVOCATION: deterministic}}
  # vdef (table tool + model call): 2 more here, 3 with the block-1 default verify.
  - {name: grafana-user-blind-vdef,   run: REF-grafana-user-blind,   stages: [verify], repeat: 2, env: {VERIFY_TOOL_CHOICE: table, VERIFY_INVOCATION: llm}}
  - {name: wordpress-user-blind-vdef, run: REF-wordpress-user-blind, stages: [verify], repeat: 2, env: {VERIFY_TOOL_CHOICE: table, VERIFY_INVOCATION: llm}}
  - {name: cacti-user-blind-vdef,     run: REF-cacti-user-blind,     stages: [verify], repeat: 2, env: {VERIFY_TOOL_CHOICE: table, VERIFY_INVOCATION: llm}}
  - {name: gitea-user-blind-vdef,     run: REF-gitea-user-blind,     stages: [verify], repeat: 2, env: {VERIFY_TOOL_CHOICE: table, VERIFY_INVOCATION: llm}}
  # vllm (model tool + model call): 3.
  - {name: grafana-user-blind-vllm,   run: REF-grafana-user-blind,   stages: [verify], repeat: 3, env: {VERIFY_TOOL_CHOICE: llm, VERIFY_INVOCATION: llm}}
  - {name: wordpress-user-blind-vllm, run: REF-wordpress-user-blind, stages: [verify], repeat: 3, env: {VERIFY_TOOL_CHOICE: llm, VERIFY_INVOCATION: llm}}
  - {name: cacti-user-blind-vllm,     run: REF-cacti-user-blind,     stages: [verify], repeat: 3, env: {VERIFY_TOOL_CHOICE: llm, VERIFY_INVOCATION: llm}}
  - {name: gitea-user-blind-vllm,     run: REF-gitea-user-blind,     stages: [verify], repeat: 3, env: {VERIFY_TOOL_CHOICE: llm, VERIFY_INVOCATION: llm}}

  # == G7 · context, triage-only on the G1 blind reference scan =============
  - {name: grafana-user-blind-codenone,   run: REF-grafana-user-blind,   stages: [triage], repeat: 3, env: {TRIAGE_CODE_CONTEXT: none}}
  - {name: wordpress-user-blind-codenone, run: REF-wordpress-user-blind, stages: [triage], repeat: 3, env: {TRIAGE_CODE_CONTEXT: none}}
  - {name: cacti-user-blind-codenone,     run: REF-cacti-user-blind,     stages: [triage], repeat: 3, env: {TRIAGE_CODE_CONTEXT: none}}
  - {name: gitea-user-blind-codenone,     run: REF-gitea-user-blind,     stages: [triage], repeat: 3, env: {TRIAGE_CODE_CONTEXT: none}}
  - {name: grafana-user-blind-peernone,   run: REF-grafana-user-blind,   stages: [triage], repeat: 3, env: {TRIAGE_PEER_CONTEXT: none}}
  - {name: wordpress-user-blind-peernone, run: REF-wordpress-user-blind, stages: [triage], repeat: 3, env: {TRIAGE_PEER_CONTEXT: none}}
  - {name: cacti-user-blind-peernone,     run: REF-cacti-user-blind,     stages: [triage], repeat: 3, env: {TRIAGE_PEER_CONTEXT: none}}
  - {name: gitea-user-blind-peernone,     run: REF-gitea-user-blind,     stages: [triage], repeat: 3, env: {TRIAGE_PEER_CONTEXT: none}}
