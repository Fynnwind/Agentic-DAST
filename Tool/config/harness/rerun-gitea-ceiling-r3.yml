# RESCAN · Gitea ceiling r3 RE-RUN — the one G3 repeat that lost its session.
# Frozen rescan of 2026-11-03 (rerun-2026-11-03f, bba768d).
#
#   uv run dast harness config/harness/rerun-gitea-ceiling-r3.yml
#
# WHY. gitea-admin-ceiling repeat 3 in 20261105T074452Z-rerun-repeats
# (run 20261106T132930Z-gitea-0614b6) lost its admin session at active_scan@1065s
# (~85% logged out; SessionWatch held_to_end False). The other two gitea ceilings
# (r1, r2) held — an intermittent gitea session loss, not a systematic break. This
# re-runs that one cell ONCE to recover a clean r3; if it logs out again, keep 2/3
# and flag.
#
# It replicates rerun-repeats.yml's `gitea-admin-ceiling` row EXACTLY (defaults +
# row), at repeat 1, reset_target on (independent draw from the clean seeded
# snapshot). Run from the main checkout = the frozen pipeline, NOT the oracle-seed
# worktree. Expect: session held to end, no CVE confirmed (gitea ceiling classes
# are open-redirect/blind — all refuted/inconclusive, as r1/r2).

defaults:
  base_env: config/scanner/.env
  max_cost_usd: 8.0
  timeout_minutes: 240
  env:
    # freeze commit: rerun-2026-11-03f  (identical to rerun-repeats.yml defaults)
    SCAN_RESET_TARGET: "on"
    TRIAGE_CODE_CONTEXT: handler+trace
    TRIAGE_HTTP_CONTEXT: balanced
    TRIAGE_PEER_CONTEXT: full
    TRIAGE_RETRIEVAL: push
    TRIAGE_SYNTHESIS_ENABLED: "on"
    TRIAGE_SYNTHESIS_REPEATS: "5"
    TRIAGE_PRUNE_NONINTERACTIVE_PHP: "off"
    TRIAGE_SCREENING_MODEL: deepseek/deepseek-v4-flash-0731
    TRIAGE_SCREENING_PROVIDER: wafer
    TRIAGE_SYNTHESIS_MODEL: deepseek/deepseek-v3.2
    TRIAGE_SYNTHESIS_PROVIDER: ""
    VERIFY_MODEL: minimax/minimax-m2.5
    VERIFY_PROVIDER: ""
    VERIFY_INVOCATION: llm
    VERIFY_MAX_ROUNDS: "3"
    VERIFY_MAX_DISPATCH_ALL_RULES: "30"
    VERIFY_MAX_DISPATCHES_TOTAL: "40"
    VERIFY_MAX_MINUTES: "20"
    VERIFY_TOOL_TIMEOUT_SECONDS: "150"
    VERIFY_MAX_SIBLINGS: "0"
    VERIFY_OOB: "off"
    TRIAGE_PROMPT_VERSION: "3"
    TRIAGE_SYNTHESIS_PROMPT_VERSION: "5"
    VERIFY_PROMPT_VERSION: "2"
    SHARED_ORACLE: "off"
    SHARED_RUN_MAX_COST_USD: "2.0"

rows:
  - {name: gitea-admin-ceiling, target: gitea, stages: [scan, triage, verify], repeat: 1, env: {SHARED_AUTH_MODE: admin, SHARED_ORACLE: "on"}}
