# RESCAN · repeats — cacti-blind TOP-UP (restores n=5).
# Frozen rescan of 2026-11-03 (freeze commit rerun-2026-11-03f).
#
#   uv run dast harness config/harness/rerun-repeats-cacti-topup.yml
#
# WHY THIS EXISTS. On 2026-10-30, one of the five cacti-admin-blind repeats in
# rerun-repeats.yml (chain 14/35, 20:49 CET) crashed during ZAP seeding with
# `httpx.RemoteProtocolError: Server disconnected without sending a response`
# (seed_zap -> zap.access_url; the ZAP daemon dropped the connection mid-seed —
# a transient, not a pipeline bug). The harness isolated the row (exited 1) and
# carried on, leaving cacti-blind at 4/5 (the band's stated floor). This sheet
# re-draws ONE cacti-admin-blind chain to restore n=5.
#
# CONFIG IS IDENTICAL to the cacti-admin-blind row in rerun-repeats.yml — same
# defaults block, same env, same stages, same admin auth — so the extra draw
# joins the same spread. Only `repeat` differs (1, not 5).
#
# BLIND IS SAFE INLINE. Blind fires no OOB template, so this needs neither the
# cacti-ceiling driver nor a manual container restart; SCAN_RESET_TARGET=on
# resets cacti to the clean seeded snapshot before the draw, same as the band.
# Run it standalone, one harness at a time (never concurrent with another) —
# slot it into the cacti-ceiling batch that runs after the main repeats sheet.

defaults:
  base_env: config/scanner/.env
  max_cost_usd: 5.0         # one blind chain (~$0.4); a mistake-bound, not a target
  timeout_minutes: 240
  env:
    # freeze commit: rerun-2026-11-03f
    SCAN_RESET_TARGET: "on"
    TRIAGE_CODE_CONTEXT: handler+trace
    TRIAGE_HTTP_CONTEXT: balanced
    TRIAGE_PEER_CONTEXT: full
    TRIAGE_RETRIEVAL: push
    TRIAGE_SYNTHESIS_ENABLED: "on"
    TRIAGE_SYNTHESIS_REPEATS: "5"
    TRIAGE_PRUNE_NONINTERACTIVE_PHP: "off"
    TRIAGE_SCREENING_MODEL: deepseek/deepseek-v4-flash-0731
    TRIAGE_SCREENING_PROVIDER: wafer
    TRIAGE_SYNTHESIS_MODEL: deepseek/deepseek-v3.2
    TRIAGE_SYNTHESIS_PROVIDER: ""
    VERIFY_MODEL: minimax/minimax-m2.5
    VERIFY_PROVIDER: ""
    VERIFY_INVOCATION: llm
    VERIFY_MAX_ROUNDS: "3"
    VERIFY_MAX_DISPATCH_ALL_RULES: "30"
    VERIFY_MAX_DISPATCHES_TOTAL: "40"
    VERIFY_MAX_MINUTES: "20"
    VERIFY_TOOL_TIMEOUT_SECONDS: "150"
    VERIFY_MAX_SIBLINGS: "0"
    VERIFY_OOB: "off"
    TRIAGE_PROMPT_VERSION: "3"
    TRIAGE_SYNTHESIS_PROMPT_VERSION: "5"
    VERIFY_PROMPT_VERSION: "2"
    SHARED_ORACLE: "off"
    SHARED_RUN_MAX_COST_USD: "2.0"

rows:
  - {name: cacti-admin-blind, target: cacti, stages: [scan, triage, verify, report], repeat: 1, env: {SHARED_AUTH_MODE: admin}}
