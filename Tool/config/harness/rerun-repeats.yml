# RESCAN · repeats — the reproducibility band (folds in G3 and G5).
# Frozen rescan of 2026-11-03 (NEXT_SESSION §6, thesis docs/RERUN-PLAN.md §6).
#
#   uv run dast harness config/harness/rerun-repeats.yml   # the USER runs this
#
# WHAT THIS IS. Per target, the full `scan triage verify (report)` chain repeated
# so every reported figure carries its spread, not a single draw (the central
# claim's synthesis reliability rests on repetition). n = 4 per target x {blind,
# ceiling}; reset per scan (SCAN_RESET_TARGET on), so each repeat is an
# independent draw from the clean seeded snapshot. G3 (the old residue split) is
# FOLDED IN here, not run separately (§6, cut 1).
#
# n = 4, cut from 5 by the author on 2026-11-02 to save scan time (the §6 cut-2 /
# §11 fallback, taken). n=4 is the band's floor; do not go below. The synthesis
# sample count (TRIAGE_SYNTHESIS_REPEATS 5) is a different number and is unchanged.
#
# THE BAND'S FIRST SAMPLE IS THE MATRIX CELL, so this sheet runs 3 per row (author,
# 2026-11-02). G1's admin-blind and G2's admin-ceiling cells are the same
# configuration as these rows: identical effective env, stages, base_env and
# timeout (checked when folded), the same freeze tag, reset per scan. So each band
# is that cell + the 3 runs here. Keep the rows' effective config identical to
# G1/G2's admin rows (tests/unit/test_rerun_sheets.py checks it); if one changes,
# the fold no longer holds. If a matrix admin cell is lost
# or redone, its replacement is the band's sample; with no usable cell, run one
# more repeat here.
#
# AUTH LEVEL. The band runs at the `admin` session (author decision 2026-10-28) —
# the widest surface, so the spread covers as many markers as possible, including
# the admin-only ones (e.g. WordPress CVE-2021-25069, unreachable at `user`). This
# moves the band OFF the `user` level that chapter 4-5 / §8.4 state the central
# claim at: the variance now reads at admin and attaches to the admin matrix cell
# (G1/G2), not the user claim — reconcile that in the thesis text, or restate the
# claim's level. The Cacti ceiling (via the driver) was already admin, so the whole
# ceiling band is now one level. The cross-level view stays G1/G2's job.
#
# CACTI CEILING IS NOT HERE. Its OOB ceiling RCEs the target and deadlocks it, so
# the 3 Cacti ceiling repeats run one-per-invocation via
# rerun-cacti-ceiling-driver.sh 3; G2's admin Cacti ceiling, driven from the same
# sheet, is the band's 4th (the Cacti BLIND repeats below are safe — blind
# fires no OOB template). Config is identical; only the execution differs.

defaults:
  base_env: config/scanner/.env
  max_cost_usd: 40.0        # ~ (7 rows x 3) full chains; a mistake-bound, not a target
  timeout_minutes: 240
  env:
    # freeze commit: rerun-2026-11-03f
    SCAN_RESET_TARGET: "on"
    TRIAGE_CODE_CONTEXT: handler+trace
    TRIAGE_HTTP_CONTEXT: balanced
    TRIAGE_PEER_CONTEXT: full
    TRIAGE_RETRIEVAL: push
    TRIAGE_SYNTHESIS_ENABLED: "on"
    TRIAGE_SYNTHESIS_REPEATS: "5"
    TRIAGE_PRUNE_NONINTERACTIVE_PHP: "off"
    TRIAGE_SCREENING_MODEL: deepseek/deepseek-v4-flash-0731
    TRIAGE_SCREENING_PROVIDER: wafer
    TRIAGE_SYNTHESIS_MODEL: deepseek/deepseek-v3.2
    TRIAGE_SYNTHESIS_PROVIDER: ""
    VERIFY_MODEL: minimax/minimax-m2.5
    VERIFY_PROVIDER: ""
    VERIFY_INVOCATION: llm
    VERIFY_MAX_ROUNDS: "3"
    VERIFY_MAX_DISPATCH_ALL_RULES: "30"
    VERIFY_MAX_DISPATCHES_TOTAL: "40"
    VERIFY_MAX_MINUTES: "20"
    VERIFY_TOOL_TIMEOUT_SECONDS: "150"
    VERIFY_MAX_SIBLINGS: "0"
    VERIFY_OOB: "off"
    TRIAGE_PROMPT_VERSION: "3"
    TRIAGE_SYNTHESIS_PROMPT_VERSION: "5"
    VERIFY_PROMPT_VERSION: "2"
    SHARED_ORACLE: "off"
    SHARED_RUN_MAX_COST_USD: "2.0"

rows:
  # == blind band (n=4 each: G1's admin cell + 3 here) ========================
  # grafana: TRIAGE_CODE_CONTEXT none — Noir extracts none of Grafana's routes
  # (custom RouteRegister), so no handler can be located and the triage gate
  # would refuse the row. Stated, not degraded. → DECISIONS.md.
  - {name: grafana-admin-blind,   target: grafana,   stages: [scan, triage, verify, report], repeat: 3, env: {SHARED_AUTH_MODE: admin, TRIAGE_CODE_CONTEXT: none}}
  - {name: wordpress-admin-blind, target: wordpress, stages: [scan, triage, verify, report], repeat: 3, env: {SHARED_AUTH_MODE: admin}}
  - {name: cacti-admin-blind,     target: cacti,     stages: [scan, triage, verify, report], repeat: 3, env: {SHARED_AUTH_MODE: admin}}
  - {name: gitea-admin-blind,     target: gitea,     stages: [scan, triage, verify, report], repeat: 3, env: {SHARED_AUTH_MODE: admin}}

  # == ceiling band (n=4 each: G2's admin cell + 3 here; Cacti via the driver)
  - {name: grafana-admin-ceiling,   target: grafana,   stages: [scan, triage, verify], repeat: 3, env: {SHARED_AUTH_MODE: admin, SHARED_ORACLE: "on", TRIAGE_CODE_CONTEXT: none}}
  - {name: wordpress-admin-ceiling, target: wordpress, stages: [scan, triage, verify], repeat: 3, env: {SHARED_AUTH_MODE: admin, SHARED_ORACLE: "on"}}
  - {name: gitea-admin-ceiling,     target: gitea,     stages: [scan, triage, verify], repeat: 3, env: {SHARED_AUTH_MODE: admin, SHARED_ORACLE: "on"}}
