# RESCAN · G1's two signed-in Cacti cells, again. They replace rows cacti-user-blind and
# cacti-admin-blind of the G1 sheet that ran at rerun-2026-11-03c (sheet 20261104T011344Z).
# Each row is unchanged (tests/unit/test_rerun_sheets.py pins it).
# At -03c every reset restored the snapshot's 363 MB cacti.log. Signed in, the log viewer
# held the session lock for minutes, and the admin crawl lost its device and graph pages.
# The user crawl stalled the same way and recovered. -03d empties the log at every reset
# (POST-FREEZE-CHANGES.md 1.17). This sheet ran at -03d (20261104T131722Z): the crawl
# recovered, but verify's sqlmap skipped every POST probe (no CSRF token, 1.19). It runs
# again at -03f, and the -03f run is the one that counts. cacti-none-blind stands: signed out,
# clog.php is the login page, and it dispatched no sqlmap.
#
#   uv run dast harness config/harness/rerun-g1-cacti-signed-in.yml
#
# After it, scripts/rerun-rewire-refs.py must take Cacti's admin-blind run from the -03f
# run of THIS sheet, not from the -03c G1 or the -03d run.
defaults:
  base_env: config/scanner/.env
  max_cost_usd: 8.0
  timeout_minutes: 240
  env:
    # freeze commit: rerun-2026-11-03f
    SCAN_RESET_TARGET: "on"
    TRIAGE_CODE_CONTEXT: handler+trace
    TRIAGE_HTTP_CONTEXT: balanced
    TRIAGE_PEER_CONTEXT: full
    TRIAGE_RETRIEVAL: push
    TRIAGE_SYNTHESIS_ENABLED: "on"
    TRIAGE_SYNTHESIS_REPEATS: "5"
    TRIAGE_PRUNE_NONINTERACTIVE_PHP: "off"
    TRIAGE_SCREENING_MODEL: deepseek/deepseek-v4-flash-0731
    TRIAGE_SCREENING_PROVIDER: wafer
    TRIAGE_SYNTHESIS_MODEL: deepseek/deepseek-v3.2
    TRIAGE_SYNTHESIS_PROVIDER: ""
    VERIFY_MODEL: minimax/minimax-m2.5
    VERIFY_PROVIDER: ""
    VERIFY_INVOCATION: llm
    VERIFY_MAX_ROUNDS: "3"
    VERIFY_MAX_DISPATCH_ALL_RULES: "30"
    VERIFY_MAX_DISPATCHES_TOTAL: "40"
    VERIFY_MAX_MINUTES: "20"
    VERIFY_TOOL_TIMEOUT_SECONDS: "150"
    VERIFY_MAX_SIBLINGS: "0"
    VERIFY_OOB: "off"
    TRIAGE_PROMPT_VERSION: "3"
    TRIAGE_SYNTHESIS_PROMPT_VERSION: "5"
    VERIFY_PROMPT_VERSION: "2"
    SHARED_ORACLE: "off"
    SHARED_RUN_MAX_COST_USD: "2.0"

rows:
  - {name: cacti-user-blind,  target: cacti, stages: [scan, triage, verify, report], env: {SHARED_AUTH_MODE: user}}
  - {name: cacti-admin-blind, target: cacti, stages: [scan, triage, verify, report], env: {SHARED_AUTH_MODE: admin}}
